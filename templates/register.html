<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create shop | DukaanSaathi AI</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>🛍️ DukaanSaathi AI</h1>
        <p>Create a separate account for your shop</p>
    </header>
    <main class="auth-main">
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}
        {% endwith %}
        <section class="panel auth-panel">
            <h2>Create shop account</h2>
            <form method="POST" action="{{ url_for('register') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="shop_name">Shop name</label>
                <input id="shop_name" type="text" name="shop_name" maxlength="120" autocomplete="organization" required>
                <label for="email">Email</label>
                <input id="email" type="email" name="email" autocomplete="email" required>
                <label for="password">Password (at least 10 characters)</label>
                <input id="password" type="password" name="password" minlength="10" autocomplete="new-password" required>
                <button type="submit">Create account</button>
            </form>
            <p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
        </section>
    </main>
</body>
</html>
