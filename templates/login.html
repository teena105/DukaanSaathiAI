<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | DukaanSaathi AI</title>
    <link rel="stylesheet" href="/style.css?v=dashboard-20261110">
</head>
<body>
    <header class="auth-header">
        <h1>🛍️ DukaanSaathi AI</h1>
        <p>Log in to manage your shop</p>
    </header>
    <main class="auth-main">
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}
        {% endwith %}
        <section class="panel auth-panel">
            <h2>Shop login</h2>
            <form method="POST" action="{{ url_for('login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" autocomplete="email" required>
                <label for="password">Password</label>
                <input id="password" type="password" name="password" autocomplete="current-password" required>
                <button type="submit">Log in</button>
            </form>
            <p>New to DukaanSaathi AI? <a href="{{ url_for('register') }}">Create a shop account</a></p>
        </section>
    </main>
</body>
</html>
